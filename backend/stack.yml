version: "3.8"

services:
  api:
    image: radar-api:latest
    networks:
      - easypanel
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      DB_SCHEMA: "radar"
      APIFY_TOKEN: "${APIFY_TOKEN}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      SENTIMENT_MODEL: "claude-haiku-4-5-20251001"
      SUGGESTIONS_MODEL: "claude-haiku-4-5-20251001"
      POSTS_PER_PROFILE: "12"
      COMMENTS_PER_POST: "50"
      SCRAPE_CRON_HOUR: "6"
      CORS_ORIGINS: "*"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first

networks:
  easypanel:
    external: true
